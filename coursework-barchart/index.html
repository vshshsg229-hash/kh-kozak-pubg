<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BarChartApp — Діаграми</title><style>:root{color-scheme:dark;--bg:#0c1220;--p:#151f31;--line:#2a3952;--t:#f0f5ff;--m:#a8b6ce;--a:#e8b94f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#182943,var(--bg) 65%);color:var(--t);font:16px system-ui,Arial}header{text-align:center;padding:24px 12px}h1{margin:0;color:var(--a)}header p,.muted{color:var(--m)}main{max-width:1100px;margin:auto;padding:12px;display:grid;grid-template-columns:minmax(250px,360px) 1fr;gap:14px}.panel{background:var(--p);border:1px solid var(--line);border-radius:15px;padding:15px}h2{font-size:18px}button,input,select{font:inherit;border:1px solid var(--line);border-radius:8px;padding:9px;background:#0d1728;color:var(--t);max-width:100%}button{cursor:pointer;background:#263853;margin:3px}button.primary{background:var(--a);color:#18202c;font-weight:bold}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:10px 0}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:5px;border-bottom:1px solid var(--line)}td input{width:100%;min-width:65px}.chartbox{overflow:auto}svg{width:100%;min-height:300px}.muted{font-size:13px}.status{color:var(--a);font-size:13px}@media(max-width:750px){main{grid-template-columns:1fr}.panel{padding:12px}} </style></head><body><header><h1>BarChartApp</h1><p>Створюй стовпчасті та лінійні діаграми прямо у браузері</p><button class="primary" id="downloadApp">⬇ Завантажити додаток (.html)</button><p class="muted">Після завантаження файл працюватиме офлайн у браузері.</p></header><main><section class="panel"><h2>Дані діаграми</h2><div class="row"><button class="primary" id="add">＋ Додати рядок</button><button id="sample">Приклад</button><button id="clear">Очистити</button></div><div class="tablewrap"><table><thead><tr><th>Назва</th><th>Значення</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><h2>Налаштування</h2><div class="row"><label>Тип <select id="kind"><option value="bar">Стовпчаста</option><option value="line">Лінійна</option></select></label><label>Напрям <select id="orient"><option value="vertical">Вертикальна</option><option value="horizontal">Горизонтальна</option></select></label></div><div class="row"><label><input type="checkbox" id="grid" checked> Сітка</label><label><input type="checkbox" id="labels" checked> Значення</label><label><input type="checkbox" id="multi" checked> Різні кольори</label></div><div class="row"><label>Колір <input id="color" type="color" value="#e8b94f"></label><label>Сортування <select id="sort"><option value="none">Без змін</option><option value="asc">За зростанням</option><option value="desc">За спаданням</option></select></label></div><div class="row"><button id="csvin">Імпорт CSV</button><input id="file" type="file" accept=".csv" hidden><button id="csvout">Завантажити CSV</button><button id="png">Зберегти PNG</button></div><p class="muted">Підтримуються від’ємні значення. Дані обробляються локально у браузері.</p><div id="status" class="status"></div></section><section class="panel"><h2>Попередній перегляд</h2><div class="chartbox"><svg id="chart" viewBox="0 0 760 460" role="img" aria-label="Діаграма"></svg></div></section></main><script>const $=id=>document.getElementById(id),tbody=$("rows"),svg=$("chart"),NS="http://www.w3.org/2000/svg";function addRow(n="",v=""){let r=tbody.insertRow(),c=r.insertCell(),d=r.insertCell(),e=r.insertCell(),a=document.createElement("input"),b=document.createElement("input"),x=document.createElement("button");a.placeholder="Категорія";a.value=n;b.type="number";b.step="any";b.value=v;x.textContent="×";x.title="Видалити рядок";c.append(a);d.append(b);e.append(x);[a,b].forEach(z=>z.oninput=draw);x.onclick=()=>{r.remove();draw()};draw()}function data(){let a=[...tbody.rows].map((r,i)=>({n:r.cells[0].firstChild.value||"Рядок "+(i+1),v:Number(r.cells[1].firstChild.value)})).filter(x=>Number.isFinite(x.v));if($("sort").value!=="none")a.sort((x,y)=>$("sort").value==="asc"?x.v-y.v:y.v-x.v);return a}function el(tag,at,txt){let n=document.createElementNS(NS,tag);Object.entries(at||{}).forEach(([k,v])=>n.setAttribute(k,v));if(txt!==undefined)n.textContent=txt;svg.append(n);return n}function draw(){svg.replaceChildren();let a=data(),W=760,H=460,L=70,R=20,T=25,B=65,pw=W-L-R,ph=H-T-B;if(!a.length){el("text",{x:W/2,y:H/2,"text-anchor":"middle",fill:"#a8b6ce"},"Додай дані");return}let mn=Math.min(0,...a.map(x=>x.v)),mx=Math.max(0,...a.map(x=>x.v));if(mn===mx){mn-=1;mx+=1}let p=(mx-mn)*.08;mn-=p;mx+=p;let y=v=>T+(mx-v)/(mx-mn)*ph,z=y(0),colors=["#e8b94f","#75a7ff","#6ee7b7","#ff8a80","#c4a7ff"];if($("grid").checked)for(let i=0;i<=5;i++){let yy=T+ph*i/5;el("line",{x1:L,y1:yy,x2:W-R,y2:yy,stroke:"#33445e","stroke-dasharray":"4 5"});el("text",{x:L-8,y:yy+4,"text-anchor":"end",fill:"#a8b6ce","font-size":12},(mx-(mx-mn)*i/5).toFixed(1))}el("line",{x1:L,y1:z,x2:W-R,y2:z,stroke:"#a8b6ce"});let hor=$("orient").value==="horizontal",line=$("kind").value==="line",pts=[];a.forEach((d,i)=>{let col=$("multi").checked?colors[i%colors.length]:$("color").value;if(!hor){let slot=pw/a.length,bw=Math.min(70,slot*.62),x=L+i*slot+(slot-bw)/2,yy=y(d.v);if(line){pts.push([x+bw/2,yy]);el("circle",{cx:x+bw/2,cy:yy,r:5,fill:col})}else el("rect",{x:x,y:Math.min(z,yy),width:bw,height:Math.max(1,Math.abs(z-yy)),rx:3,fill:col});el("text",{x:x+bw/2,y:H-B+19,"text-anchor":"middle",fill:"#d6dfef","font-size":12},d.n.slice(0,12));if($("labels").checked)el("text",{x:x+bw/2,y:d.v>=0?yy-8:yy+17,"text-anchor":"middle",fill:"#fff","font-size":12},d.v)}else{let slot=ph/a.length,bh=Math.min(38,slot*.62),yy=T+i*slot+(slot-bh)/2,scale=pw/(mx-mn),x=L+(Math.min(0,d.v)-mn)*scale,w=Math.abs(d.v)*scale;el("rect",{x:x,y:yy,width:Math.max(1,w),height:bh,rx:3,fill:col});el("text",{x:L-8,y:yy+bh/2+4,"text-anchor":"end",fill:"#d6dfef","font-size":12},d.n.slice(0,12));if($("labels").checked)el("text",{x:d.v>=0?x+w+5:x-5,y:yy+bh/2+4,"text-anchor":d.v>=0?"start":"end",fill:"#fff","font-size":12},d.v)}});if(line&&!hor&&pts.length>1){let q=document.createElementNS(NS,"polyline");q.setAttribute("points",pts.map(p=>p.join(",")).join(" "));q.setAttribute("fill","none");q.setAttribute("stroke",$("color").value);q.setAttribute("stroke-width",3);svg.insertBefore(q,svg.children[Math.max(0,svg.children.length-pts.length)])}}function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$("downloadApp").onclick=()=>{const source="<!doctype html>\\n"+document.documentElement.outerHTML;const blob=new Blob([source],{type:"text/html;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="BarChartApp.html";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);$("status").textContent="Додаток завантажується у форматі HTML."};$("add").onclick=()=>addRow();$("sample").onclick=()=>{tbody.replaceChildren();[["Січень",12],["Лютий",19],["Березень",-6],["Квітень",25],["Травень",16]].forEach(d=>addRow(...d));$("status").textContent="Додано приклад"};$("clear").onclick=()=>{tbody.replaceChildren();draw();$("status").textContent="Дані очищено"};["kind","orient","grid","labels","multi","color","sort"].forEach(id=>$(id).oninput=draw);$("csvout").onclick=()=>download(new Blob(["Назва,Значення\n"+data().map(d=>JSON.stringify(d.n)+","+d.v).join("\n")],{type:"text/csv;charset=utf-8"}),"diagram.csv");$("csvin").onclick=()=>$("file").click();$("file").onchange=async e=>{let f=e.target.files[0];if(!f)return;tbody.replaceChildren();(await f.text()).split(/\r?\n/).slice(1).filter(Boolean).forEach(s=>{let m=s.match(/^\s*"?(.+?)"?[,;\t]\s*(-?[\d.,]+)/);if(m)addRow(m[1].replaceAll("\"\"","\""),m[2].replace(",","."))});$("status").textContent="CSV імпортовано";e.target.value=""};$("png").onclick=()=>{let xml=new XMLSerializer().serializeToString(svg),u=URL.createObjectURL(new Blob([xml],{type:"image/svg+xml"})),im=new Image();im.onload=()=>{let c=document.createElement("canvas");c.width=1520;c.height=920;let x=c.getContext("2d");x.fillStyle="#151f31";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,1520,920);c.toBlob(b=>download(b,"diagram.png"));URL.revokeObjectURL(u)};im.src=u};addRow("Категорія A",10);addRow("Категорія B",25);addRow("Категорія C",15);</script></body></html>

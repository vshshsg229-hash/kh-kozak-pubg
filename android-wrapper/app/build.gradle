plugins {
    id 'com.android.application' version '8.10.1'
}

android {
    namespace 'com.khkozak.battlehub'
    compileSdk 36

    defaultConfig {
        applicationId 'com.khkozak.battlehub'
        minSdk 23
        targetSdk 36
        versionCode 95
        versionName '9.5.2'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }
}

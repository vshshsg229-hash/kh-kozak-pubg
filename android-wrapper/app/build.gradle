plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'com.khkozak.battlehub'
    compileSdk 35

    defaultConfig {
        applicationId 'com.khkozak.battlehub'
        minSdk 23
        targetSdk 35
        versionCode 87
        versionName '8.7.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }
}

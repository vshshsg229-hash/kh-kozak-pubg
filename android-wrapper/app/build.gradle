plugins {
    id 'com.android.application' version '8.10.1'
}

android {
    namespace 'com.khkozak.battlehub'
    compileSdk 37

    defaultConfig {
        applicationId 'com.khkozak.battlehub'
        minSdk 23
        targetSdk 37
        versionCode 92
        versionName '9.2.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }
}

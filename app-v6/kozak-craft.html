<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08120d"><title>KOZAK CRAFT — KH Battle Hub</title>
<style>
:root{color-scheme:dark;--lime:#66ff9b;--panel:#0a1712;--line:#254a35}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07100b;color:#eaffef;font:14px system-ui,Arial; -webkit-font-smoothing:antialiased}#game{position:fixed;inset:0;background:linear-gradient(#8ed6ff,#d7edff 55%,#5b8f4c)}canvas{display:block;image-rendering:auto;outline:none}#hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));text-shadow:0 2px 4px #000}header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px} .glass{pointer-events:auto;background:#07140dd9;border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 4px 18px #0005;backdrop-filter:blur(8px)}.brand{font-weight:1000;letter-spacing:.1em;color:var(--lime)}.sub{font-size:10px;color:#a8c8b2;letter-spacing:.1em;margin-top:3px}.stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.stat{font-size:11px;color:#c4e8ce}.stat b{color:white}.crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:24px;color:white;opacity:.9;text-shadow:0 0 5px #000}.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}.help{max-width:340px;font-size:11px;line-height:1.5;color:#d4eadb}.hotbar{display:flex;gap:5px;justify-content:center;pointer-events:auto;flex-wrap:wrap}.slot{width:48px;height:48px;background:#07140de8;border:1px solid #3b6548;border-radius:8px;color:#eaffef;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.slot.active{border:2px solid var(--lime);box-shadow:0 0 12px #66ff9b66}.slot i{font-style:normal;font-size:18px}.actions{display:flex;gap:6px;pointer-events:auto}.actions button,.topbtn,.move button{background:#0a1b11df;color:white;border:1px solid #3d7650;border-radius:10px;padding:11px 13px;font-weight:800;min-height:42px}.actions .primary{background:#174b2c;border-color:var(--lime)}#mobileControls{position:fixed;inset:auto 0 78px 0;display:none;justify-content:space-between;align-items:end;padding:12px;pointer-events:none}.move{display:grid;grid-template-columns:44px 44px 44px;grid-template-rows:44px 44px 44px;gap:4px;pointer-events:auto}.move button{padding:0;font-size:18px;opacity:.88}.move .up{grid-column:2}.move .left{grid-column:1;grid-row:2}.move .down{grid-column:2;grid-row:2}.move .right{grid-column:3;grid-row:2}.jump{pointer-events:auto;display:flex;flex-direction:column;gap:8px}.jump button{border-radius:50%;width:58px;height:58px;padding:0}.hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:16px;background:#06110deF;border:1px solid #66ff9b;border-radius:12px;max-width:320px;text-align:center;pointer-events:auto;display:none}.hint button{margin-top:10px}.back{color:#b6f9ca;text-decoration:none;font-size:12px;display:inline-block;margin-top:6px}@media(max-width:700px),(pointer:coarse){#mobileControls{display:flex}.help{display:none}.bottom{align-items:center;flex-direction:column-reverse}.hotbar{max-width:100%}.slot{width:42px;height:44px}.actions button{padding:9px 10px}.stats .stat:nth-child(3){display:none}}#toast{position:fixed;top:90px;left:50%;transform:translateX(-50%);background:#07140df2;border:1px solid var(--lime);border-radius:9px;padding:10px 14px;display:none;max-width:90%;text-align:center}

/* KOZAK CRAFT visual clarity pass */
.glass{background:rgba(5,16,11,.88);border:1px solid rgba(145,255,177,.38);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.28);backdrop-filter:blur(12px);text-shadow:none}
.brand{font-size:clamp(15px,2.4vw,20px);letter-spacing:.08em;text-shadow:0 0 18px #42e98255}
.sub{font-size:10px;letter-spacing:.16em;color:#b3d9bf}
.stat{font-size:12px;padding:2px 3px}.stat b{font-size:14px;color:#fff}
.slot{width:54px;height:54px;background:rgba(4,13,8,.94);border:1px solid #527b5d;border-radius:10px;box-shadow:0 4px 10px #0004;font-weight:800}.slot i{font-size:21px}.slot span{font-size:9px;letter-spacing:.03em}.slot.active{background:#164a2b;border:2px solid #86ffad;box-shadow:0 0 0 2px #17492c,0 0 18px #66ff9b66}
.actions button,.topbtn,.move button{background:rgba(6,23,13,.96);border:1px solid #4d8c5f;border-radius:12px;box-shadow:0 4px 12px #0003;transition:transform .12s,background .12s}.actions button:active,.move button:active{transform:scale(.95);background:#245e36}.actions .primary{background:linear-gradient(135deg,#1d7940,#14532e);border-color:#83ffab}
.crosshair{font-size:25px;font-weight:300;color:#fff;text-shadow:0 0 4px #000,0 0 10px #000;pointer-events:none}
.help{font-size:12px;line-height:1.7;max-width:370px;color:#e1f4e6}.back{font-weight:700}
#mobileControls{bottom:88px}.move button{font-size:20px;touch-action:none;user-select:none;-webkit-user-select:none}.jump button{background:#15482b;border:2px solid #83ffab;font-size:22px;box-shadow:0 4px 16px #0005}
#toast{z-index:10;font-weight:800;box-shadow:0 8px 30px #0008}
@media(max-width:700px),(pointer:coarse){#hud{padding:calc(9px + env(safe-area-inset-top)) 8px calc(8px + env(safe-area-inset-bottom))}header{align-items:flex-start}.glass{padding:9px 10px}.brand{font-size:15px}.sub{font-size:9px}.stats{gap:4px}.stat{font-size:10px}.stat b{font-size:12px}.bottom{gap:7px}.hotbar{gap:4px}.slot{width:42px;height:48px}.slot i{font-size:18px}.slot span{font-size:8px}.actions{width:100%;justify-content:center}.actions button{flex:1;max-width:145px;font-size:11px}.help{display:none}.crosshair{font-size:23px}}
@media(min-width:701px){.bottom{align-items:flex-end}.hotbar{position:absolute;left:50%;transform:translateX(-50%);bottom:0}.actions{margin-left:auto}}
</style>
</head>
<body><div id="game"></div>
<div id="hud"><header><div class="glass"><div class="brand">⛏ KOZAK CRAFT</div><div class="sub">VOXEL SURVIVAL · BETA</div><a class="back" href="./index.html">← Назад у Battle Hub</a></div><div class="glass stats"><span class="stat">❤ <b id="hp">100</b></span><span class="stat">▦ <b id="blocks">0</b> блоків</span><span class="stat">☀ <b id="time">День</b></span></div></header><div class="crosshair">+</div><div class="bottom"><div class="glass help">ПК: WASD — рух · миша — огляд · Space — стрибок · ЛКМ — зламати · ПКМ — поставити блок. Телефон: кнопки руху, перетягуй екран для огляду.</div><div class="hotbar" id="hotbar"></div><div class="actions"><button id="breakBtn">⛏ Зламати</button><button class="primary" id="placeBtn">▧ Поставити</button><button id="saveBtn">💾 Зберегти</button></div></div></div>
<div id="mobileControls"><div class="move"><button class="up" data-move="forward">▲</button><button class="left" data-move="left">◀</button><button class="down" data-move="back">▼</button><button class="right" data-move="right">▶</button></div><div class="jump"><button id="jumpBtn">⬆</button><button id="lookBtn">👁</button></div></div><div id="toast"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
const $=id=>document.getElementById(id); const toast=t=>{const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.style.display='none',1800)};
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9ddcff);scene.fog=new THREE.Fog(0x9ddcff,20,62);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,140);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;$('game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe5f7ff,0x40552b,2.25));const sun=new THREE.DirectionalLight(0xfff3d1,2.6);sun.position.set(-15,25,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-28;sun.shadow.camera.right=28;sun.shadow.camera.top=28;sun.shadow.camera.bottom=-28;scene.add(sun);
const mats={grass:new THREE.MeshLambertMaterial({color:0x4c9c42}),dirt:new THREE.MeshLambertMaterial({color:0x80502f}),stone:new THREE.MeshLambertMaterial({color:0x858c8e}),wood:new THREE.MeshLambertMaterial({color:0x85532f}),leaves:new THREE.MeshLambertMaterial({color:0x2f773c}),sand:new THREE.MeshLambertMaterial({color:0xc9b56c}),plank:new THREE.MeshLambertMaterial({color:0xb9854c}),brick:new THREE.MeshLambertMaterial({color:0x9c5140})};
const types=['grass','dirt','stone','wood','leaves','sand','plank','brick'];const icons={grass:'🌿',dirt:'🟫',stone:'🪨',wood:'🪵',leaves:'🍃',sand:'🟨',plank:'🪚',brick:'🧱'};
const cube=new THREE.BoxGeometry(1,1,1);const blocks=new Map(),meshes=[];let selected='grass',inventory=Object.fromEntries(types.map(t=>[t,t==='grass'?32:t==='dirt'?16:t==='wood'?8:0]));
const key=(x,y,z)=>x+','+y+','+z;function addBlock(x,y,z,type,save=true){const k=key(x,y,z);if(blocks.has(k))return false;const m=new THREE.Mesh(cube,mats[type]||mats.grass);m.castShadow=true;m.receiveShadow=true;m.position.set(x,y,z);m.userData={x,y,z,type,custom:save};scene.add(m);blocks.set(k,m);meshes.push(m);if(save)inventory[type]=(inventory[type]||0);return true}
function removeBlock(m){if(!m)return;const d=m.userData;scene.remove(m);blocks.delete(key(d.x,d.y,d.z));const i=meshes.indexOf(m);if(i>=0)meshes.splice(i,1);inventory[d.type]=(inventory[d.type]||0)+1;refreshUI()}
function terrainHeight(x,z){return Math.floor(1+Math.sin(x*.22)*1.5+Math.cos(z*.19)*1.3+Math.sin((x+z)*.11))}
for(let x=-18;x<=18;x++)for(let z=-18;z<=18;z++){let h=terrainHeight(x,z);for(let y=-2;y<=h;y++)addBlock(x,y,z,y===h?(Math.abs(h)<.5?'sand':'grass'):y>h-3?'dirt':'stone',false)}
for(let x=-15;x<=15;x+=4)for(let z=-15;z<=15;z+=5){if(Math.random()>.62)continue;let h=terrainHeight(x,z);addBlock(x,h+1,z,'wood',false);addBlock(x,h+2,z,'wood',false);for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)for(let dy=1;dy<=3;dy++)if(Math.abs(dx)+Math.abs(dz)+dy<7&&!blocks.has(key(x+dx,h+dy,z+dz)))addBlock(x+dx,h+dy,z+dz,'leaves',false)}
const player={x:0,y:terrainHeight(0,0)+2,z:6,vy:0,yaw:0,pitch:0,onGround:false};camera.position.set(player.x,player.y,player.z);
const raycaster=new THREE.Raycaster();let locked=false;renderer.domElement.addEventListener('click',()=>{if(matchMedia('(pointer:fine)').matches&&!locked)renderer.domElement.requestPointerLock?.()});document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===renderer.domElement);
document.addEventListener('mousemove',e=>{if(!locked)return;player.yaw-=e.movementX*.002;player.pitch=Math.max(-1.35,Math.min(1.35,player.pitch-e.movementY*.002))});
let touchLook=null;renderer.domElement.addEventListener('touchstart',e=>{if(e.touches.length===1)touchLook={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});renderer.domElement.addEventListener('touchmove',e=>{if(!touchLook||e.touches.length!==1)return;const t=e.touches[0],dx=t.clientX-touchLook.x,dy=t.clientY-touchLook.y;player.yaw-=dx*.006;player.pitch=Math.max(-1.2,Math.min(1.2,player.pitch-dy*.006));touchLook={x:t.clientX,y:t.clientY};},{passive:true});renderer.domElement.addEventListener('touchend',()=>touchLook=null);
const keys={};document.addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();if(e.code==='Space'&&player.onGround)player.vy=7;if(e.code==='KeyE')place();if(e.code==='KeyQ')breakTarget()});document.addEventListener('keyup',e=>keys[e.code]=false);
const held={};document.querySelectorAll('[data-move]').forEach(b=>{const k=b.dataset.move;b.addEventListener('pointerdown',e=>{e.preventDefault();held[k]=true});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>held[k]=false))});$('jumpBtn').addEventListener('pointerdown',()=>{if(player.onGround)player.vy=7});
function refreshUI(){$('blocks').textContent=Object.values(inventory).reduce((a,b)=>a+b,0);$('hotbar').innerHTML=types.map(t=>'<button class="slot '+(selected===t?'active':'')+'" data-type="'+t+'"><i>'+icons[t]+'</i><span>'+t.toUpperCase().slice(0,5)+' '+(inventory[t]||0)+'</span></button>').join('');document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{selected=b.dataset.type;refreshUI()})}
function targetBlock(){raycaster.setFromCamera(new THREE.Vector2(0,0),camera);return raycaster.intersectObjects(meshes,false).find(hit=>hit.distance<6)}
function breakTarget(){const h=targetBlock();if(h&&h.object.userData.y>-2){removeBlock(h.object);toast('Блок зібрано!')}else toast('Підійди ближче до блока')}
function place(){if((inventory[selected]||0)<1){toast('Немає цього блока! Зламай блок, щоб зібрати ресурс.');return}const h=targetBlock();if(!h){toast('Наведи приціл на блок');return}const p=h.object.position.clone().add(h.face.normal);const x=Math.round(p.x),y=Math.round(p.y),z=Math.round(p.z);if(Math.abs(x-player.x)<1&&Math.abs(z-player.z)<1&&Math.abs(y-player.y)<2){toast('Не можна поставити блок у собі');return}if(addBlock(x,y,z,selected)){inventory[selected]--;refreshUI();toast('Блок встановлено')}}
$('breakBtn').onclick=breakTarget;$('placeBtn').onclick=place;$('lookBtn').onclick=()=>toast('Перетягуй поле гри пальцем, щоб оглядати світ');
const saveKey='kozak-craft-world-v1';function save(){const data={player:{x:player.x,y:player.y,z:player.z,yaw:player.yaw,pitch:player.pitch},inventory,custom:[...blocks.values()].filter(m=>m.userData.custom).map(m=>m.userData)};try{localStorage.setItem(saveKey,JSON.stringify(data));toast('Світ збережено на цьому пристрої!')}catch{toast('Не вдалося зберегти світ')}}$('saveBtn').onclick=save;
try{const data=JSON.parse(localStorage.getItem(saveKey)||'null');if(data){Object.assign(player,data.player||{});inventory={...inventory,...data.inventory};for(const b of data.custom||[]){const m=blocks.get(key(b.x,b.y,b.z));if(m)removeBlock(m);addBlock(b.x,b.y,b.z,b.type,false)}toast('Збереження завантажено')}}catch{}
refreshUI();let elapsed=0,last=performance.now();
function tick(now){requestAnimationFrame(tick);const dt=Math.min((now-last)/1000,.04);last=now;elapsed+=dt;
const forward=(keys.KeyW||keys.ArrowUp||held.forward?1:0)-(keys.KeyS||keys.ArrowDown||held.back?1:0);const side=(keys.KeyD||keys.ArrowRight||held.right?1:0)-(keys.KeyA||keys.ArrowLeft||held.left?1:0);const speed=keys.ShiftLeft?7:4.4;player.x+=(Math.sin(player.yaw)*forward+Math.cos(player.yaw)*side)*speed*dt;player.z+=(-Math.cos(player.yaw)*forward+Math.sin(player.yaw)*side)*speed*dt;player.vy-=18*dt;player.y+=player.vy*dt;
const ground=terrainHeight(Math.round(player.x),Math.round(player.z))+1.65;if(player.y<ground){player.y=ground;player.vy=0;player.onGround=true}else player.onGround=false;
player.x=Math.max(-19,Math.min(19,player.x));player.z=Math.max(-19,Math.min(19,player.z));camera.position.set(player.x,player.y,player.z);camera.rotation.order='YXZ';camera.rotation.y=player.yaw;camera.rotation.x=player.pitch;
sun.position.set(Math.sin(elapsed*.03)*25,20,Math.cos(elapsed*.03)*20);const night=(Math.sin(elapsed*.025)<-.3);$('time').textContent=night?'Ніч':'День';scene.background.set(night?0x14213a:0x9ddcff);scene.fog.color.set(night?0x14213a:0x9ddcff);sun.intensity=night?.45:2.2;
if(locked&&keys.Mouse0)breakTarget();renderer.render(scene,camera)}
requestAnimationFrame(tick);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
renderer.domElement.addEventListener('contextmenu',e=>{e.preventDefault();place()});renderer.domElement.addEventListener('mousedown',e=>{if(e.button===0&&locked)breakTarget()});
</script></body></html>

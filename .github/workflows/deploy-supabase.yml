name: Deploy Supabase Hub API
on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Deploy hub-api after the current SQL schema has been applied"
        required: true
        type: boolean
        default: false
jobs:
  deploy:
    if: ${{ inputs.confirm_deploy }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy Edge Function
        run: supabase functions deploy hub-api --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

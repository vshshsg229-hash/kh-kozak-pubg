name: Deploy Supabase Hub API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate Supabase deployment credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          if [[ ! "${SUPABASE_ACCESS_TOKEN:-}" =~ ^sbp_[A-Za-z0-9_-]{30,}$ ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN must be the full Supabase Personal Access Token (sbp_ prefix plus the complete token). Do not use a publishable key, a partial token, or the Firebase service-account JSON. Create one in Supabase Dashboard → Account → Access Tokens."
            exit 1
          fi
          if [[ "${SUPABASE_PROJECT_REF:-}" != "xacqretciujzrcqjvvgz" ]]; then
            echo "::error::SUPABASE_PROJECT_REF must be xacqretciujzrcqjvvgz for KH Kozak Battle Hub."
            exit 1
          fi

      - name: Deploy hub-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy hub-api --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Show health-check URL
        run: |
          echo "After deployment, test:"
          echo "https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/hub-api/api/health"
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

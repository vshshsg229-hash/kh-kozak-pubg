name: Firebase Functions checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [firebase-integration-setup]

jobs:
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package.json
      - run: npm install
      - run: npm run lint

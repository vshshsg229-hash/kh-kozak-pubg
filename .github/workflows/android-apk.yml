name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app-v6/**'
      - 'android-wrapper/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          accept-android-sdk-licenses: true
          packages: 'platforms;android-36 build-tools;36.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Package the current web app into Android assets
        run: |
          mkdir -p android-wrapper/app/src/main/assets/www
          cp -R app-v6/. android-wrapper/app/src/main/assets/www/
      - name: Check universal control center JavaScript syntax
        run: node --check app-v6/global-control-center.js
      - name: Build installable debug APK
        working-directory: android-wrapper
        run: gradle --no-daemon assembleDebug
      - name: Prepare download name
        run: cp android-wrapper/app/build/outputs/apk/debug/app-debug.apk KH-Kozak-Battle-Hub.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KH-Kozak-Battle-Hub-APK
          path: KH-Kozak-Battle-Hub.apk
          retention-days: 30
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: KH么Kozak Battle Hub Android build ${{ github.run_number }}
          body: |
            Installable Android debug APK built automatically from the current KH么Kozak Battle Hub web app.
            Version 9.5.2 Creator Studio update for phone, tablet and desktop layouts. Android versionCode 95, versionName 9.5.2, targetSdk 36 (Android 16).
            The app stores local progress on this device. Online server features are not required for local mini-games.
          files: KH-Kozak-Battle-Hub.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Battle Hub quality checks

on:
  push:
    branches: [main]
    paths:
      - "app-v6/**"
      - ".github/workflows/battle-hub-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "app-v6/**"
      - ".github/workflows/battle-hub-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: Validate app assets and JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check app-v6/app.js
          node --check app-v6/nexus-world-expansion.js
          node --check app-v6/nexus-civilization.js
          node --check app-v6/nexus-artifact-forge.js
          node --check app-v6/nexus-world-bosses.js
          node --check app-v6/battle-hub-3.js
          node --check app-v6/fighter-inventory-v16.12.js
          node --check app-v6/i18n.js
          node --check app-v6/media.js
          node --check app-v6/background-music.js
          node --check app-v6/music-sleep-timer.js
          node --check app-v6/arcade-100.js
          node --check app-v6/games-3d.js
          node --check app-v6/bunker.js
          node --check app-v6/progression-hub.js
          node --check app-v6/battle-evolution.js
          node --check app-v6/character-lobby.js
          node --check app-v6/app-update.js
          node --check app-v6/app-management.js
          node --check app-v6/battle-world.js
          node --check app-v6/creator-studio.js
          node --check app-v6/creator-editor.js


      - name: Validate NEXUS World standalone scripts and offline data defaults
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('app-v6/nexus-world.html', 'utf8');
          const appHtml = fs.readFileSync('app-v6/index.html', 'utf8');
          if (!appHtml.includes('data-tab="nexusworld"') || !appHtml.includes('id="tab-nexusworld"')) throw new Error('NEXUS World must be available as an integrated main-app tab');
          if (!appHtml.includes('nexus-world.html?v=1.4.1&embed=1')) throw new Error('Integrated NEXUS World iframe must load the versioned embedded page');
          if (!html.includes('data-view="forge"') || !html.includes('id="view-forge"')) throw new Error('Artifact Forge must be integrated as a NEXUS World view');
          if (!html.includes('nexus-artifact-forge.js?v=1.1.0')) throw new Error('Artifact Forge controller must be loaded');
          if (!html.includes('data-view="bosses"') || !html.includes('id="view-bosses"')) throw new Error('World Boss arena must be integrated as a NEXUS World view');
          if (!html.includes('nexus-world-bosses.js?v=20.10.0')) throw new Error('World Boss controller must be loaded');
          if (!html.includes('nexus-civilization.js?v=2.0.0')) throw new Error('Living Civilization engine must be loaded');
          if (!sw.includes('nexus-civilization.js?v=2.0.0')) throw new Error('Living Civilization engine must be precached for offline use');
          const blocks = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)].map(match => match[1]).filter(source => source.trim());
          if (!html.includes('id="galaxyMap"') || !blocks[0].includes("$('#galaxyMap').innerHTML")) throw new Error('Nine-sector cosmic atlas must render interactive map nodes');
          if (blocks.length !== 1) throw new Error('Expected exactly one inline NEXUS World engine script');
          fs.writeFileSync('/tmp/nexus-world-inline.js', blocks[0]);
          const expansion = fs.readFileSync('app-v6/nexus-world-expansion.js', 'utf8');
          const defaults = expansion.match(/const fresh=\(\)=>\(\{[\s\S]*?\}\);/);
          if (!defaults || !/\bdata:\s*\d+/.test(defaults[0])) throw new Error('NEXUS World Expansion must initialize its local data resource');
          const sectorBlock = blocks[0].match(/const sectors=\[([\s\S]*?)\n\];/);
          if (!sectorBlock) throw new Error('NEXUS World sector map is missing');
          const sectorIds = [...sectorBlock[1].matchAll(/\{id:'([^']+)'/g)].map(match => match[1]);
          if (sectorIds.length !== 9 || new Set(sectorIds).size !== 9) throw new Error('NEXUS World must contain nine unique sectors');
          if (!blocks[0].includes('s.explored.length===sectors.length')) throw new Error('Final progression must use the live sector count');
          if (!blocks[0].includes('commanderSkills:Array.isArray(x.commanderSkills)?x.commanderSkills:[]')) throw new Error('Existing world saves must migrate with a default Commander skill list');
          const commanderPerks = ['supply','trade','reserve','scanner','routes','relics','modular','research','omega'];
          for (const perk of commanderPerks) if (!blocks[0].includes("id:'" + perk + "'")) throw new Error('Commander progression perk is missing: ' + perk);
          if (!blocks[0].includes('function renderCommander()') || !blocks[0].includes('data-commander-skill')) throw new Error('Commander progression UI and unlock controls must be active');
          if (!blocks[0].includes('nexus-artifact-state') || !blocks[0].includes('artifactBonus')) throw new Error('Artifact Forge bonuses must synchronize with the local world save');
          if (!blocks[0].includes('nexus-boss-state')) throw new Error('World Boss progress must synchronize with the local world save');
          const bosses = fs.readFileSync('app-v6/nexus-world-bosses.js', 'utf8');
          for (const boss of ['iron-warden','colossus','rift-weaver','nebula-queen','omega-sentinel']) if (!bosses.includes("id:'" + boss + "'")) throw new Error('World Boss encounter is missing: ' + boss);
          for (const feature of ['phaseOf','data-boss-action','bossState','trophies','repairUsed']) if (!bosses.includes(feature)) throw new Error('World Boss combat feature is missing: ' + feature);
          const forge = fs.readFileSync('app-v6/nexus-artifact-forge.js', 'utf8');
          for (const feature of ['artifactLevels','equippedArtifacts','data-relic-upgrade','data-relic-equip']) if (!forge.includes(feature)) throw new Error('Artifact Forge feature is missing: ' + feature);
          const scriptRef = html.match(/<script src="([^"]*nexus-world-expansion\.js\?v=[^"]+)" defer><\/script>/);
          if (!scriptRef) throw new Error('Versioned NEXUS World Expansion script reference is missing');
          const sw = fs.readFileSync('app-v6/sw.js', 'utf8');
          if (!sw.includes('"./' + scriptRef[1] + '"')) throw new Error('NEXUS World Expansion script must be precached for offline use');
          if (!sw.includes('"./nexus-artifact-forge.js?v=1.1.0"')) throw new Error('Artifact Forge controller must be precached for offline use');
          if (!sw.includes('"./nexus-world-bosses.js?v=20.10.0"')) throw new Error('World Boss controller must be precached for offline use');
          NODE
          node --check /tmp/nexus-world-inline.js

      - name: Check syntax of every active JavaScript file
        shell: bash
        run: |
          node --input-type=module <<'NODE' > /tmp/kh-active-js-files.txt
          import fs from 'node:fs';
          import path from 'node:path';
          const html = fs.readFileSync('app-v6/index.html', 'utf8');
          const files = new Set();
          for (const match of html.matchAll(/<script\b[^>]*\bsrc=["']([^"']+\.js(?:\?[^"']*)?)["']/gi)) {
            const url = match[1];
            if (/^(?:https?:|\/\/|data:)/i.test(url)) continue;
            const local = url.split(/[?#]/)[0].replace(/^\.\//, '');
            if (local) files.add(path.join('app-v6', local));
          }
          for (const file of [...files].sort()) console.log(file);
          NODE
          while IFS= read -r file; do
            echo "Checking $file"
            node --check "$file"
          done < /tmp/kh-active-js-files.txt


      - name: Validate PWA manifest and referenced local assets
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root = 'app-v6';
          const html = fs.readFileSync(path.join(root, 'index.html'), 'utf8');
          const manifest = JSON.parse(fs.readFileSync(path.join(root, 'manifest.webmanifest'), 'utf8'));
          const checks = [];
          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
            checks.push(message);
          };

          const versionData = JSON.parse(fs.readFileSync(path.join(root, 'version.json'), 'utf8'));
          const appVersion = versionData.version;
          const serviceWorker = fs.readFileSync(path.join(root, 'sw.js'), 'utf8');
          const updater = fs.readFileSync(path.join(root, 'app-update.js'), 'utf8');
          const management = fs.readFileSync(path.join(root, 'app-management.js'), 'utf8');
          assert(html.includes('<title>' + versionData.app + '</title>'), 'HTML document title matches version.json app name');
          assert(html.includes('<i>' + appVersion + '</i>'), 'Sidebar version matches version.json');
          assert(manifest.name.includes(versionData.app) && manifest.description.includes(versionData.app), 'PWA manifest matches version.json app name');
          assert(serviceWorker.includes('kozak-nexus-v' + appVersion), 'Service worker cache matches version.json');
          assert(updater.includes("const WEB_VERSION = '" + appVersion + "'"), 'Update checker matches version.json');
          assert(management.includes("const APP_VERSION='" + appVersion + "'"), 'Manual refresh diagnostics match version.json');

          // Validate the active inventory UI, not the retired character-lobby prototype.
          assert(html.includes('fighter-inventory-v16.12.js?v=16.16.0') && html.includes('fighter-inventory-v16.12.css?v=16.16.0'), 'Active Fighter inventory assets are referenced with cache versions');
          const fighter = fs.readFileSync(path.join(root, 'fighter-inventory-v16.12.js'), 'utf8');
          const fighterCss = fs.readFileSync(path.join(root, 'fighter-inventory-v16.12.css'), 'utf8');
          for (const feature of ['ПОЛЬОВИЙ НОВОБРАНЕЦЬ','M416 EMBER CORE','NEON VIPER','equippedSkin','equippedWeaponSkin']) {
            assert(fighter.includes(feature), 'Fighter inventory includes ' + feature);
          }
          assert(fighterCss.includes('.kh-inventory') && fighterCss.includes('.kh-inv-item') && fighterCss.includes('.kh-inv-equipped'), 'Fighter inventory styles are present');
          const progression = fs.readFileSync(path.join(root, 'progression-hub.js'), 'utf8');
          assert(progression.includes("next.ownedSource[reward.item]='freePass'") && progression.includes('next.ownedAt[reward.item]=Date.now()'), 'Pass cosmetics record their source and acquisition timestamp');
          assert(progression.includes('progressionPassClaims:{season:claims.season,claimed:[...claimed,level]}'), 'Pass claim markers are stored atomically with the profile');
          assert(progression.includes('if(!safeWrite(PROFILE_KEY,next))'), 'Pass reward claim handles profile-save failures');
          const mainApp = fs.readFileSync(path.join(root, 'app.js'), 'utf8');
          assert(mainApp.includes('function restoreRewardState(snapshot)') && mainApp.includes('return true}catch(e){return false}'), 'Failed pass writes restore the previous state and report failure');
          assert(mainApp.includes('ownedSources') && mainApp.includes("recordOwnedSource(awarded,'freePass')") && mainApp.includes("recordOwnedSource(premiumAward,'elitePass')"), 'Profile preserves reward provenance from both pass tracks');
          assert(mainApp.includes("sources.includes('freePass')") && mainApp.includes("sources.includes('elitePass')"), 'Pass filters show items earned from either pass even if already owned');
          assert(mainApp.includes('sourceNames') && mainApp.includes('sourceList') && mainApp.includes("join(' + ')"), 'Profile labels all acquisition sources for each cosmetic');
          // The live UI uses Creator Studio; creator-editor is a retired, unmounted prototype.
          const creatorStudio = fs.readFileSync(path.join(root, 'creator-studio.js'), 'utf8');
          const creatorStudioCss = fs.readFileSync(path.join(root, 'creator-studio.css'), 'utf8');
          for (const feature of ['khCreatorStudio', 'khCreatorNewIdea', 'khCreatorCopyIdea', 'khCreatorPosted', 'data-khc-open', 'PROFILES']) assert(creatorStudio.includes(feature), 'Creator Studio feature exists: ' + feature);
          assert(creatorStudioCss.includes('.kh-creator-studio') && creatorStudioCss.includes('.kh-creator-profiles') && creatorStudioCss.includes('.kh-creator-tool'), 'Creator Studio styles exist');
          assert(html.includes('creator-studio.js?v=1.1.0') && html.includes('creator-studio.css?v=1.1.0'), 'Active Creator Studio assets are referenced');
          assert(manifest.name?.includes(versionData.app) && manifest.start_url && manifest.scope,
            'PWA manifest has the current app name, start URL and scope');
          assert(Array.isArray(manifest.icons) && manifest.icons.length > 0,
            'PWA manifest declares at least one icon');


          const swCoreMatch = serviceWorker.match(/const CORE = \[(.*?)\];/s);
          assert(swCoreMatch, 'Service worker core asset list exists');
          const swCoreAssets = [...swCoreMatch[1].matchAll(/"([^"]+)"/g)].map(match => match[1]);

          const activeLocalScripts = [...html.matchAll(/<script\b[^>]*\bsrc=["']([^"']+\.js(?:\?[^"']*)?)["']/gi)].map(match => match[1]).filter(url => !/^(?:https?:|\/\/|data:)/i.test(url));
          const precacheUrls = new Set(swCoreAssets.map(asset => asset.replace(/^\.\//, '')));
          for (const script of activeLocalScripts) assert(precacheUrls.has(script.replace(/^\.\//, '')), 'Active script matches service worker precache URL: ' + script);
          assert(!html.includes('https://www.tiktok.com/@uakozak5'), 'Retired TikTok profile link is removed');
          assert(html.includes('https://www.tiktok.com/@tiktok.comkhkozak4') && html.includes('https://www.tiktok.com/@baggy8364'), 'Current TikTok profile links remain available');
          for (const asset of swCoreAssets) {
            const local = asset.split('?')[0].split('#')[0].replace(/^\.\//, '');
            if (!local || local.endsWith('/')) continue;
            assert(fs.existsSync(path.join(root, local)), 'Service worker precache asset exists: ' + local);
          }

          const media = fs.readFileSync(path.join(root, 'media.js'), 'utf8');
          assert(media.includes('const uaMusicDailyKeys=') && media.includes("let saved='daily'") && media.includes('Добірка дня:'), 'Ukrainian music automatically rotates its daily playlist');
          assert(html.includes('interface-refresh.css?v=13.9.2'), 'Refreshed interface stylesheet is loaded');
          assert(html.includes('id="tab-music"') && html.includes('id="tab-tiktok"'), 'Music and TikTok tabs exist');
          assert(html.includes('data-unique-id="tiktok.comkhkozak4"') && html.includes('data-unique-id="baggy8364"'), 'Both TikTok creator feeds exist');
          assert(html.includes('href="https://www.tiktok.com/@baggy8364"') && html.includes('href="https://www.tiktok.com/@tiktok.comkhkozak4"'), 'Both TikTok profile links exist');
          assert(!html.includes('id="tiktokForm"') && !html.includes('id="tiktokSavedList"') && !media.includes("const tiktokForm="), 'Removed TikTok preparation form and saved-video list');
          assert(html.includes('href="https://www.tiktok.com/@tiktok.comkhkozak4" target="_blank"') && html.includes('tab-telegram'), 'Telegram tab includes the working TikTok profile shortcut');
          assert(media.includes('shorts|embed|live|v'), 'YouTube player recognizes Shorts, embeds, live streams, and standard videos');
          assert(media.includes('const uaMusicDailyKeys=') && media.includes("let saved='daily'") && media.includes('Добірка дня:'), 'Ukrainian music automatically rotates its daily playlist');
          assert(media.includes('onStateChange') && media.includes('PlayerState.ENDED') && media.includes('loadVideoById'), 'Embedded music player automatically advances to the next queued track');
          assert(media.includes('khMusicQueueIndex=(khMusicQueueIndex+1)%khMusicQueue.length'), 'Music queue loops after the final track');

          for (const match of html.matchAll(/(?:src|href)="([^"]+)"/g)) {
            const value = match[1];
            if (/^(?:https?:|data:|#|\/\/)/i.test(value)) continue;
            const localPath = value.split('?')[0].split('#')[0];
            if (!localPath || localPath.endsWith('/')) continue;
            assert(fs.existsSync(path.join(root, localPath)),
              `Referenced local asset exists: ${localPath}`);
          }

          for (const id of ['tab-home', 'tab-games', 'tab-missions', 'tab-rewards',
            'tab-profile', 'tab-pass', 'tab-bunker', 'tab-telegram', 'tab-assistant', 'tab-3d',
            'gameModal', 'installPc', 'copyPcLink']) {
            assert(html.includes(`id="${id}"`), `Required interface element exists: ${id}`);
          }

          for (const game of ['reaction', 'aim', 'quiz', 'memory', 'loot', 'pubg',
            'classic', 'metro', 'arena', 'zombie']) {
            assert(html.includes(`data-game="${game}"`),
              `Game launch control exists: ${game}`);
          }

          const gameEngine = fs.readFileSync(path.join(root, 'app.js'), 'utf8');
          const fighterInventory = fs.readFileSync(path.join(root, 'fighter-inventory-v16.12.js'), 'utf8');
          assert(!html.includes('online-sync') && !html.includes('creator-feed.js'),
            'No online account or server-upload scripts are loaded');
          assert(!gameEngine.includes('khOnlineSync') && !gameEngine.includes('applyRemoteUser'),
            'Coins, XP, daily rewards and game progress stay local-only');
          assert(!fighterInventory.includes('khOnlineSync') && !fighterInventory.includes('khkozak-online-user'),
            'Fighter inventory and shop stay local-only');
          assert(gameEngine.includes('function startZombie()'), 'Zombie survival mode is implemented');
          assert(gameEngine.includes('if(zombie&&enemies.every(e=>e.hp<=0))'), 'Zombie mode advances through waves');
          assert(html.includes('mode-shortcuts') && html.includes('data-game="zombie"'), 'Featured modes are easy to find');

          const threeD = fs.readFileSync(path.join(root, 'games-3d.js'), 'utf8');
          for (const mode of ['3D ARENA · BATTLE SURVIVAL', 'OFFROAD DRIVE 3D', 'TACTICAL RANGE 3D', 'ZOMBIE SURVIVAL 3D', 'SNIPER CHALLENGE 3D', 'PARKOUR RUN 3D', 'BOSS FIGHT 3D']) {
            assert(threeD.includes(mode), '3D mode exists: ' + mode);
          }
          for (const control of ['kh3dCanvas', 'kh3dAction', 'kh3dReload', 'kh3dAmmo', 'reloadWeapon', 'kh3dRestart', 'kh3d-finished']) {
            assert(threeD.includes(control), '3D control/reward hook exists: ' + control);
          }
          assert(/gameCleanup=\[\]/.test(threeD), '3D scene cleanup list is initialized');
          for (const mode of ["id:'zombie'", "id:'sniper'", "id:'parkour'", "id:'boss'"]) assert(threeD.includes(mode), 'New playable 3D mode exists: ' + mode);
          assert(html.includes('games-3d.js?v='), 'HTML loads the versioned 3D engine');
          const arcade = fs.readFileSync(path.join(root, 'arcade-100.js'), 'utf8');
          assert(arcade.includes('const names=[') && arcade.includes('10 ігор · 10 різних механік') && arcade.includes('10 механік'), 'Arcade catalog accurately describes its 10 unique game mechanics');
          assert(arcade.includes('kh100Random'), 'Arcade includes random game launch');
          assert(threeD.includes('7 ГОТОВИХ 3D РЕЖИМІВ') && threeD.includes('const modes=['), '3D Arena accurately advertises its current playable catalog');
          const modeMatch = threeD.match(/const modes=(\[[\s\S]*?\]);\n\nlet selectedModeName/);
          assert(modeMatch && (modeMatch[1].match(/\{id:'/g) || []).length === 7, '3D Arena has exactly 7 implemented modes');
          const battleHub3 = fs.readFileSync(path.join(root, 'battle-hub-3.js'), 'utf8');
          const battleHub3Css = fs.readFileSync(path.join(root, 'battle-hub-3.css'), 'utf8');
          for (const feature of ['Тренування прицілу', 'Дуель реакції', 'Маршрут зони', 'Злам сейфа', 'Контроль віддачі', 'Тактичний лут', 'Командир операції', 'ОПЕРАЦІЯ ДНЯ', 'khBh3Search', 'data-bh3-fav', 'Козак AI']) {
            assert(battleHub3.includes(feature), 'Battle Hub 3.0 feature exists: ' + feature);
          }
          assert(battleHub3.includes('kh-bh3-finished') && battleHub3.includes('kh_bh3_reward_'), 'Battle Hub 3.0 rewards are routed to progression and protected against same-day duplicate claims');
          assert(battleHub3.includes('data.stats[g.id]') && battleHub3.includes('Особистий рекорд'), 'Battle Hub 3.0 tracks plays and personal best scores');
          assert(battleHub3.includes('function dailyChallenges()') && battleHub3.includes('function dailyStreak()') && battleHub3.includes('data-bh3-mission-claim'), 'Battle Hub 3.0 includes daily missions and a training streak');
          assert(battleHub3.includes('const trainingPlans=') && battleHub3.includes('function startTrainingPlan(goal)') && battleHub3.includes('data-bh3-plan-next'), 'Kozak AI provides guided multi-step training plans');
          assert(battleHub3.includes('function renderCatalogMatches(query)') && battleHub3.includes('data-bh3-catalog-launch') && battleHub3.includes("addEventListener('input',()=>{renderGames(activeFilter());renderCatalogMatches($('#khBh3Search')?.value||'')})"), 'Quick Start search filters live and can launch catalog-wide results');
          assert(battleHub3.includes('function resultTip(id,score)') && battleHub3.includes('Розбір «'), 'Kozak AI provides contextual post-game coaching');
          assert(battleHub3.includes('function renderCombatRecord()') && battleHub3.includes('Твої досягнення'), 'Battle Hub 3.0 combat record and achievements exist');
          assert(battleHub3.includes('data-bh3-category') && battleHub3.includes('function launchRandomTraining'), 'Quick Start category filters and random training launcher exist');
          assert(battleHub3.includes('Мій марафон улюбленого') && battleHub3.includes("goal==='favorites'"), 'Favorites training marathon is present');
          assert(battleHub3.includes('запусти випадкову гру') && battleHub3.includes('запусти марафон улюбленого'), 'Kozak AI can execute game launch commands');
          assert(battleHub3.includes('khBh3RandomStatus') && battleHub3.includes('За цими фільтрами нічого не знайдено'), 'Random training respects filters and explains empty results');
          assert(battleHub3.includes('const recommendedTraining=') && battleHub3.includes('запусти персональне тренування'), 'Kozak AI recommends and launches a personalized training mode');
          assert(battleHub3.includes('categoryRequests') && battleHub3.includes('Увімкнув категорію'), 'Kozak AI can switch game categories');
          assert(battleHub3.includes('function enhanceAssistant()') && battleHub3.includes('Відкриваю «Ігри та режими»'), 'Kozak AI can navigate to requested app sections');
          assert(battleHub3Css.includes('.kh-bh3-grid') && battleHub3Css.includes('@media(max-width:620px)'), 'Battle Hub 3.0 has responsive game cards and mobile styles');
          assert(html.includes('battle-hub-3.js?v=17.17.0') && html.includes('battle-hub-3.css?v=17.17.0'), 'Battle Hub 3.0 assets are loaded with their current cache versions');
          const manager = fs.readFileSync(path.join(root, 'app-management.js'), 'utf8');
          assert(manager.includes('data-khm-diagnostics') && manager.includes('data-khm-reset'), 'Local app management and diagnostics tools exist');
          assert(html.includes('bunker.js?v=17.63.0'), 'HTML loads Bunker mode');
          // Battle Evolution is intentionally not loaded in the current approved UI.
          const bunker = fs.readFileSync(path.join(root, 'bunker.js'), 'utf8');
          for (const feature of ['data-bunker-upgrade', 'bunkerScavenge', 'bunkerClaim', 'bunkerTrophyGrid']) assert(bunker.includes(feature), 'Bunker feature exists: ' + feature);

          const academy = fs.readFileSync(path.join(root, 'kozak-academy.js'), 'utf8');
          const academyCss = fs.readFileSync(path.join(root, 'kozak-academy.css'), 'utf8');
          assert(html.includes('kozak-academy.js?v=1.4.0') && html.includes('kozak-academy.css?v=1.5.5'), 'Kozak Academy JS and CSS are loaded with current versioned URLs');
          assert(academy.includes("modeButton('daily'") && academy.includes("modeButton('memory'") && academy.includes("modeButton('code'") && academy.includes("modeButton('focus'"), 'Academy includes daily missions, memory, secret-code, and attention mini-game modes');
          assert(academy.includes('academy-code-') && academy.includes('СЕКРЕТНА МІСІЯ'), 'Academy includes secret-code challenges');
          assert(academy.includes('academy-daily-') && academy.includes('Скриня дня'), 'Academy includes a daily reward chest');
          assert(academy.includes('DAY_MS=24*60*60*1000') && academy.includes('dailyCycleStart') && academy.includes('academy-daily-mission-') && academy.includes('Нові місії через'), 'Academy rotates five daily missions on a 24-hour timer');
          assert(academy.includes('kha-daily-banner') && academy.includes('kha-child-help') && academy.includes('Помилятися — це нормально'), 'Daily missions use child-friendly instructions, feedback and readable controls');
          assert((academy.match(/\{id:'[^']+',category:/g) || []).length >= 36, 'Kozak Academy includes at least 36 learning questions');
          assert((academy.match(/\{id:'riddle-/g) || []).length >= 12, 'Kozak Academy includes at least 12 riddles');
          assert((academy.match(/\{id:'odd-/g) || []).length >= 10, 'Kozak Academy includes at least 10 attention mini-games');
          assert(academy.includes('const rewards={first:') && academy.includes('kha-sticker-collection') && academy.includes('state.stickers.push'), 'Academy awards collectible stickers for achievements and daily chests');
          assert(academy.includes('KOZAK KIDS WORLD') && academy.includes('Лисеня Кузя'), 'Academy uses child-friendly adventure branding and companion');
          assert(academy.includes("api.awardChallenge(XP_PREFIX+q.id,0,15)") && academy.includes("const XP_PREFIX='academy-v1-q-'"), 'Academy XP rewards use unique, idempotent challenge IDs');
          assert(academy.includes("if(state.current&&!state.solved.includes(state.current))") && academy.includes("b.classList.remove('is-wrong')"), 'Academy prevents skipping unanswered questions and clears stale wrong-answer feedback');
          assert(academy.includes("localStorage.setItem(KEY,JSON.stringify(state))") && !/\bfetch\s*\(/.test(academy), 'Academy progress is local-only and does not call a server');
          assert(academyCss.includes('@media(max-width:560px)') && academyCss.includes(':focus-visible') && academyCss.includes('KOZAK KIDS WORLD') && academyCss.includes('.kha-focus-grid'), 'Academy includes child-friendly visuals, mobile and keyboard-focus styling');

                    console.log(`Passed ${checks.length} Battle Hub static checks.`);
          NODE


      - name: Validate cosmic theme and locked navigation
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('app-v6/index.html', 'utf8');
          const css = fs.readFileSync('app-v6/nexus-cosmic-refresh.css', 'utf8');
          const sw = fs.readFileSync('app-v6/sw.js', 'utf8');
          const version = JSON.parse(fs.readFileSync('app-v6/version.json', 'utf8'));
          if (!html.includes('nexus-cosmic-refresh.css?v=20.14.0')) throw new Error('Cosmic theme stylesheet is not loaded');
          if (!sw.includes('"./nexus-cosmic-refresh.css?v=20.14.0"')) throw new Error('Cosmic theme stylesheet is not cached offline');
          if (!css.includes('.sidebar') || !css.includes('.nav-item.active') || !css.includes('#kh-home-v2 .kv2-hero')) throw new Error('Cosmic theme must cover the existing shell and home hero');
          if (version.version !== '20.14.0') throw new Error('Release metadata must match 20.14.0');
          if (!html.includes('progression-hub.js?v=20.14.0')) throw new Error('100-level Battle Pass controller is not loaded');
          const pass = fs.readFileSync('app-v6/progression-hub.js', 'utf8');
          const freeBlock = pass.match(/const tiers=\\[([\\s\\S]*?)\\n\\];/);
          const eliteBlock = pass.match(/const eliteRewards=\\[([\\s\\S]*?)\\];/);
          if (!freeBlock || [...freeBlock[1].matchAll(/\\{n:(\\d+),name:/g)].length !== 100) throw new Error('Free Battle Pass must contain exactly 100 levels');
          if (!eliteBlock || [...eliteBlock[1].matchAll(/\\{n:(\\d+),name:/g)].length !== 20) throw new Error('Elite Pass must contain 20 milestone rewards through level 100');
          if (!pass.includes('reward=level===100?') || !pass.includes('РІВЕНЬ \' + Math.min(100,level) + \' / 100')) throw new Error('Level 100 final reward and progress display must be active');
          if (!sw.includes('"./progression-hub.js?v=20.14.0"')) throw new Error('100-level Battle Pass must be cached offline');
          const tabs = [...html.matchAll(/data-tab="([^"]+)"/g)].map(match => match[1]);
          const panels = new Set([...html.matchAll(/id="tab-([^"]+)"/g)].map(match => match[1]));
          for (const tab of new Set(tabs.filter(value => /^[a-z0-9_-]+$/i.test(value)))) if (!panels.has(tab)) throw new Error('Navigation target is missing: ' + tab);
          for (const tab of ['home','games','nexusworld','3d','pass','missions','bunker','profile','music','tiktok','telegram']) {
            if (!panels.has(tab)) throw new Error('Required existing mode was removed: ' + tab);
          }
          if (!html.includes('id="nexusIntro"') || !html.includes('id="nexusIntroSkip"')) throw new Error('Animated startup screen must remain available');
          let depth = 0;
          for (const ch of css) { if (ch === '{') depth++; if (ch === '}') depth--; if (depth < 0) throw new Error('Cosmic theme CSS has an unmatched closing brace'); }
          if (depth !== 0) throw new Error('Cosmic theme CSS has unclosed blocks');
          console.log('Cosmic theme, offline cache, loading screen and locked navigation checks passed.');
          NODE

      - name: Check service worker syntax
        run: node --check app-v6/sw.js


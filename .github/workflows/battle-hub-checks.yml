name: Battle Hub quality checks

on:
  push:
    branches: [main]
    paths:
      - "app-v6/**"
      - "backend/**"
      - "supabase/**"
      - ".github/workflows/battle-hub-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "app-v6/**"
      - "supabase/**"
      - ".github/workflows/battle-hub-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: Validate app assets and JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check app-v6/app.js
          node --check app-v6/i18n.js
          node --check app-v6/media.js
          node --check app-v6/arcade-100.js
          node --check app-v6/games-3d.js
          node --check app-v6/bunker.js
          node --check app-v6/progression-hub.js
          node --check app-v6/battle-evolution.js
          node --check app-v6/character-lobby.js
          node --check app-v6/app-update.js
          node --check app-v6/battle-world.js
          node --check app-v6/creator-studio.js
          node --check app-v6/creator-editor.js
          node --check app-v6/creator-feed.js
          node --check backend/server.js

      - name: Validate PWA manifest and referenced local assets
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root = 'app-v6';
          const html = fs.readFileSync(path.join(root, 'index.html'), 'utf8');
          const manifest = JSON.parse(fs.readFileSync(path.join(root, 'manifest.webmanifest'), 'utf8'));
          const checks = [];
          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
            checks.push(message);
          };

          assert(html.includes('character-lobby.js?v=1.4.2') && html.includes('character-lobby.css?v=1.4.1'), 'Fighter 2.0 assets are referenced with fresh cache versions');
          const fighter = fs.readFileSync(path.join(root, 'character-lobby.js'), 'utf8');
          const fighterCss = fs.readFileSync(path.join(root, 'character-lobby.css'), 'utf8');
          for (const feature of ['ТАКТИЧНИЙ ПРОФІЛЬ','ШТУРМОВИК','РОЗВІДНИК','МЕДИК','СЦЕНА ОГЛЯДУ','ОСОБЛИВЕ ЗАВДАННЯ','khMissionDone']) {
            assert(fighter.includes(feature), 'Fighter 2.0 includes ' + feature);
          }
          assert(fighterCss.includes('.kh-role-picker') && fighterCss.includes('.kh-scene-night') && fighterCss.includes('.kh-daily-fighter'), 'Fighter 2.0 styles are present');
          const creatorEditor = fs.readFileSync(path.join(root, 'creator-editor.js'), 'utf8');
          const creatorEditorCss = fs.readFileSync(path.join(root, 'creator-editor.css'), 'utf8');
          for (const feature of ['khcExport', 'khcCover', 'khcCopyCaption', 'khcStart', 'khcEnd', 'tiktok.com/upload']) assert(creatorEditor.includes(feature), 'Creator editor feature exists: ' + feature);
          assert(creatorEditorCss.includes('.khc-editor-grid') && creatorEditorCss.includes('.khc-preview-frame'), 'Creator editor styles exist');
          assert(html.includes('creator-editor.js?v=1.2.0') && html.includes('creator-editor.css?v=1.2.0'), 'Creator editor assets are referenced');
          assert(html.includes('creator-feed.js?v=1.0.0') && html.includes('creator-feed.css?v=1.0.0'), 'Shared creator video feed assets are referenced');
          const creatorFeed = fs.readFileSync(path.join(root, 'creator-feed.js'), 'utf8');
          assert(creatorFeed.includes('/api/creator/videos') && creatorFeed.includes('khc:publish-video'), 'Shared video feed uses the public API and editor publish event');
          assert(manifest.name?.includes('KH') && manifest.start_url && manifest.scope,
            'PWA manifest has app name, start URL and scope');
          assert(Array.isArray(manifest.icons) && manifest.icons.length > 0,
            'PWA manifest declares at least one icon');

          for (const match of html.matchAll(/(?:src|href)="([^"]+)"/g)) {
            const value = match[1];
            if (/^(?:https?:|data:|#|\/\/)/i.test(value)) continue;
            const localPath = value.split('?')[0].split('#')[0];
            if (!localPath || localPath.endsWith('/')) continue;
            assert(fs.existsSync(path.join(root, localPath)),
              `Referenced local asset exists: ${localPath}`);
          }

          for (const id of ['tab-home', 'tab-games', 'tab-missions', 'tab-rewards',
            'tab-profile', 'tab-pass', 'tab-bunker', 'tab-telegram', 'tab-admin', 'tab-assistant', 'tab-3d',
            'gameModal', 'installPc', 'copyPcLink']) {
            assert(html.includes(`id="${id}"`), `Required interface element exists: ${id}`);
          }

          for (const game of ['reaction', 'aim', 'quiz', 'memory', 'loot', 'pubg',
            'classic', 'metro', 'arena', 'zombie']) {
            assert(html.includes(`data-game="${game}"`),
              `Game launch control exists: ${game}`);
          }

          const gameEngine = fs.readFileSync(path.join(root, 'app.js'), 'utf8');
          assert(gameEngine.includes('function startZombie()'), 'Zombie survival mode is implemented');
          assert(gameEngine.includes('if(zombie&&enemies.every(e=>e.hp<=0))'), 'Zombie mode advances through waves');
          assert(html.includes('mode-shortcuts') && html.includes('data-game="zombie"'), 'Featured modes are easy to find');

          const threeD = fs.readFileSync(path.join(root, 'games-3d.js'), 'utf8');
          for (const mode of ['3D ARENA · BATTLE SURVIVAL', 'OFFROAD DRIVE 3D', 'TACTICAL RANGE 3D', 'ZOMBIE SURVIVAL 3D', 'SNIPER CHALLENGE 3D', 'PARKOUR RUN 3D', 'BOSS FIGHT 3D']) {
            assert(threeD.includes(mode), '3D mode exists: ' + mode);
          }
          for (const control of ['kh3dCanvas', 'kh3dAction', 'kh3dReload', 'kh3dAmmo', 'reloadWeapon', 'kh3dRestart', 'kh3d-finished']) {
            assert(threeD.includes(control), '3D control/reward hook exists: ' + control);
          }
          assert(/gameCleanup=\[\]/.test(threeD), '3D scene cleanup list is initialized');
          for (const mode of ["id:'zombie'", "id:'sniper'", "id:'parkour'", "id:'boss'"]) assert(threeD.includes(mode), 'New playable 3D mode exists: ' + mode);
          assert(html.includes('games-3d.js?v=1.3.1'), 'HTML loads current 3D engine version with ammo update');
          assert(html.includes('bunker.js?v=1.1.0'), 'HTML loads Bunker mode');
          assert(html.includes('battle-evolution.js?v=1.1.0'), 'HTML loads Battle Evolution contracts and tournament board');
          const evolution = fs.readFileSync(path.join(root, 'battle-evolution.js'), 'utf8');
          for (const feature of ['Розминка загону', 'Операція тижня', 'ЛОКАЛЬНИЙ ТУРНІР', 'КАР’ЄРНІ ВІДКРИТТЯ', 'career150', 'khkozak_online_token_v1']) assert(evolution.includes(feature), 'Battle Evolution feature exists: ' + feature);
          const bunker = fs.readFileSync(path.join(root, 'bunker.js'), 'utf8');
          for (const feature of ['data-bunker-upgrade', 'bunkerScavenge', 'bunkerClaim', 'bunkerTrophyGrid']) assert(bunker.includes(feature), 'Bunker feature exists: ' + feature);

          console.log(`Passed ${checks.length} Battle Hub static checks.`);
          NODE

      - name: Check service worker syntax
        run: node --check app-v6/sw.js

      - name: Validate Supabase security and feature schema
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const sql = fs.readFileSync('supabase/schema.sql', 'utf8').toLowerCase();
          const api = fs.readFileSync('supabase/functions/hub-api/index.ts', 'utf8');
          const app = fs.readFileSync('app-v6/app.js', 'utf8');
          const checks = [];
          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
            checks.push(message);
          };

          for (const table of [
            'hub_profiles', 'hub_game_events', 'hub_telegram_links',
            'hub_telegram_link_codes', 'hub_telegram_daily_claims',
            'hub_shop_catalog', 'hub_inventory', 'hub_daily_shop_purchases',
            'hub_achievements'
          ]) {
            assert(sql.includes('create table if not exists public.' + table),
              'Schema declares ' + table);
            assert(sql.includes('alter table public.' + table + ' enable row level security'),
              'RLS enabled for ' + table);
          }

          for (const fn of [
            'hub_finish_game', 'hub_claim_telegram_daily',
            'hub_purchase_item', 'hub_equip_item', 'hub_refresh_achievements'
          ]) {
            assert(sql.includes('function public.' + fn),
              'Schema declares RPC ' + fn);
            assert(api.includes('"' + fn + '"'),
              'Edge Function calls RPC ' + fn);
          }

          assert(api.includes('ADMIN_USER_IDS') && api.includes('async function isAdmin'),
            'Admin endpoints have server-side identity checks');
          assert(api.includes('SUPABASE_SERVICE_ROLE_KEY'),
            'Service role key is read only by the server function');
          assert(!app.includes('SUPABASE_SERVICE_ROLE_KEY') &&
                 !app.includes('service_role key') &&
                 !app.includes('service_role_key'),
            'Frontend does not contain service-role key identifiers');
          assert(api.includes('zombie: { coins: 30, points: 40, xp: 45 }'),
            'Zombie mode has a server-side reward policy');

          for (const [name, source] of [['schema.sql', sql], ['elite migration', fs.readFileSync('supabase/migrations/20261014142000_elite_ideas_and_payments.sql', 'utf8').toLowerCase()], ['skin inventory hotfix migration', fs.readFileSync('supabase/migrations/20261014173000_fix_skin_inventory_purchase.sql', 'utf8').toLowerCase()]]) {
            assert(source.includes("elsif v_item.item_kind in ('title','frame','avatar','theme','badge','banner','skin','weaponskin') then"),
              name + ' grants purchased character and weapon skins to inventory');
          }
          assert(api.includes('p_base_coins: base.coins') &&
                 api.includes('p_base_points: base.points') &&
                 api.includes('p_base_xp: base.xp'),
            'Game reward amounts come from server-side reward map');

          console.log('Passed ' + checks.length + ' Supabase schema/security checks.');
          NODE

name: Check KH么Kozak AI

on:
  workflow_dispatch:
  push:
    paths:
      - 'assistant.js'
      - 'assistant.html'
      - 'apps/android/**'
      - 'apps/windows/**'
      - '.github/workflows/check-kh-kozak-ai.yml'

permissions:
  contents: read

jobs:
  check-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check assistant JavaScript syntax
        run: node --check assistant.js

  check-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $path = "apps/windows/KH-Kozak-Assistant.ps1"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "PowerShell syntax OK"

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p apps/android assembleDebug

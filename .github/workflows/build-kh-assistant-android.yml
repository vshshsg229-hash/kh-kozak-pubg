name: Build KH Assistant Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/android/**'
      - '.github/workflows/build-kh-assistant-android.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p apps/android assembleDebug
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kh-kozak-assistant-android-v0.2.0-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: assistant-v0.2.${{ github.run_number }}
          name: KH么Kozak Assistant Android v0.2.${{ github.run_number }}
          body: |
            Оновлена тестова збірка KH么Kozak Assistant.
            Підтримує історію команд, швидкі посилання на Gaming Hub, покращене введення та голосовий режим.
            Це debug APK для прямого встановлення, не публікація Google Play.
          files: apps/android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          make_latest: true

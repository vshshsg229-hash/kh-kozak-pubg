name: Build KH Kozak Windows app
on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/build-windows-app.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run build:win
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: KH-Kozak-Windows-Installer
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish downloadable Windows installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v1.0.${{ github.run_number }}
          name: KH Kozak Gaming Hub for Windows v1.0.${{ github.run_number }}
          make_latest: true
          files: desktop/dist/*.exe
          generate_release_notes: true

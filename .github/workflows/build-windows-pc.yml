name: Build Windows PC app # v4

on:
  push:
    paths:
      - "desktop/**"
      - "app-v6/**"
      - ".github/workflows/build-windows-pc.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kozak-nexus-windows-release
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Sync Windows version from app version.json
        shell: pwsh
        run: |
          $version = (Get-Content app-v6/version.json -Raw | ConvertFrom-Json).windowsVersion
          if ($version -notmatch '^\d+(\.\d+){2}$') { throw "Invalid windowsVersion in app-v6/version.json: $version" }
          $env:WINDOWS_VERSION = $version
          node -e "const fs=require('node:fs');const p=JSON.parse(fs.readFileSync('desktop/package.json','utf8'));p.version=process.env.WINDOWS_VERSION;fs.writeFileSync('desktop/package.json',JSON.stringify(p,null,2)+'\n')"
          "WINDOWS_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare desktop package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/web | Out-Null
          Copy-Item -Path app-v6/* -Destination desktop/web -Recurse -Force

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Check Nexus Protocol JavaScript syntax
        run: node --check app-v6/nexus-ops.js
      - name: Check NEXUS WORLD inline JavaScript syntax
        shell: pwsh
        run: |
          node -e "const fs=require('node:fs');const h=fs.readFileSync('app-v6/nexus-world.html','utf8');const m=h.match(/<script>\\s*([\\s\\S]*?)<\\/script>/i);if(!m)throw new Error('NEXUS WORLD inline script not found');fs.writeFileSync('app-v6/nexus-world-inline-check.tmp.js',m[1]);"
          node --check app-v6/nexus-world-inline-check.tmp.js
          Remove-Item app-v6/nexus-world-inline-check.tmp.js

      - name: Check app update notifier JavaScript syntax
        run: node --check app-v6/app-update.js

      - name: Check Battle World 2.0 JavaScript syntax
        run: node --check app-v6/battle-world.js

      - name: Check TikTok Creator Studio JavaScript syntax
        run: node --check app-v6/creator-studio.js

      - name: Check TikTok video editor JavaScript syntax
        run: node --check app-v6/creator-editor.js

      - name: Check KOZAK Assistant JavaScript syntax
        run: node --check app-v6/kozak-device-assistant.js

      - name: Check PC companion JavaScript syntax
        run: node --check app-v6/pc-companion.js

      - name: Check universal control center JavaScript syntax
        run: node --check app-v6/global-control-center.js

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows installer and portable app
        working-directory: desktop
        run: npm run dist:win

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KOZAK-NEXUS-Windows-${{ env.WINDOWS_VERSION }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable Windows release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-v${{ env.WINDOWS_VERSION }}
          name: KOZAK NEXUS for Windows ${{ env.WINDOWS_VERSION }}
          body: |
            Windows x64 release of KOZAK NEXUS ${{ env.WINDOWS_VERSION }}.
            Includes the installer and portable application.
          files: |
            desktop/dist/*.exe
          fail_on_unmatched_files: true

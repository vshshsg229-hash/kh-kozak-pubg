name: Check Render API

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - ".github/workflows/check-render-api.yml"

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe KH Kozak Render API
        shell: bash
        run: |
          set +e
          code=$(curl --silent --show-error --location --max-time 30 \
            --output /tmp/health.json --write-out "%{http_code}" \
            "https://khkozak-battle-hub-api-uftt.onrender.com/api/health")
          result=$?
          echo "curl_exit_code=$result"
          echo "http_status=${code:-000}"
          if [ -f /tmp/health.json ]; then
            cat /tmp/health.json
            echo
          fi
          if [ "$result" -ne 0 ] || [ "$code" != "200" ]; then
            echo "::error::Render API health check failed; inspect curl exit code and HTTP status above."
            exit 1
          fi
